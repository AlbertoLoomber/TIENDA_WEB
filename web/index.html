<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nomad Rack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Yellowtail&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- PAGE:START -->
<div class="page" id="page">
  <header class="top">
    <a class="top__link" href="#about" id="nav-about">About</a>
    <a class="logo" href="#" aria-label="Nomad home">Nomad</a>
    <a class="top__link" href="#contact" id="nav-contact">Contact</a>
    <button class="top__close" id="close" type="button" hidden>Close</button>
  </header>

  <main class="stage">
    <section class="rack" id="rack" aria-label="Clothing rack">
      <div class="rack__inner" id="rack-inner">
        <div class="rail" id="rail" aria-hidden="true">
          <span class="rail__shadow"></span>
          <span class="rail__mount"></span>
          <span class="rail__tube"><span class="rail__glint" id="glint"></span></span>
          <span class="rail__mount"></span>
        </div>
        <div class="rack__row" id="rack-row"></div>
      </div>
    </section>

    <p class="caption" id="caption" aria-live="polite">&nbsp;</p>
    <button class="pill" id="see" type="button">See availability</button>

    <section class="detail" id="detail" aria-label="Garment detail" hidden>
      <button class="detail__arrow detail__arrow--prev" id="prev" type="button" aria-label="Previous garment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg></button>
      <figure class="detail__figure" id="detail-figure" role="img" aria-label=""></figure>
      <button class="detail__arrow detail__arrow--next" id="next" type="button" aria-label="Next garment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>
      <div class="detail__info">
        <p class="detail__cat"><span id="detail-cat"></span><span class="detail__count" id="detail-count"></span></p>
        <h1 class="detail__name" id="detail-name"></h1>
        <button class="pill" id="detail-see" type="button" aria-expanded="false" aria-controls="drawer">See availability</button>
      </div>
      <button class="handle" id="handle" type="button" aria-label="Show sizes" aria-expanded="false" aria-controls="drawer"></button>
      <div class="drawer" id="drawer" hidden>
        <p class="drawer__label">Select size</p>
        <div class="sizes" role="radiogroup" aria-label="Size">
          <button type="button" role="radio" aria-checked="false">S</button>
          <button type="button" role="radio" aria-checked="true">M</button>
          <button type="button" role="radio" aria-checked="false">L</button>
          <button type="button" role="radio" aria-checked="false">XL</button>
        </div>
        <p class="drawer__note">Heavyweight cotton · Oversized fit</p>
      </div>
    </section>
  </main>

  <div class="cursor" id="cursor" aria-hidden="true"><span>View</span></div>

  <footer class="band" aria-hidden="true">
    <div class="band__track" id="band-track"></div>
  </footer>
</div>
<!-- PAGE:END -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="app.js"></script>
</body>
</html>
